# docker-compose 部署路径（在仓库根目录执行）：
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --scale backend=3
name: hw4

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: hw4/backend:1.1
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_VERSION: ${APP_VERSION}
      MAX_MESSAGES: "50"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    image: hw4/gateway:1.0
    environment:
      BACKEND_URL: http://backend:5000
      APP_TITLE: ${APP_TITLE}
      APP_VERSION: ${APP_VERSION}
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
