apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hw4
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # 滚动更新期间始终保持全部副本可用
  template:
    metadata:
      labels:
        app: backend
    spec:
      topologySpreadConstraints:   # 多节点集群中尽量把副本打散到不同节点
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: hw4/backend:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: guestbook-config
          env:
            - name: APP_VERSION         # 覆盖 ConfigMap 中的版本号，便于观察滚动更新
              value: "1.1.0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guestbook-secret
                  key: REDIS_PASSWORD
            - name: POD_NAME            # Downward API：把 Pod 名注入为实例标识
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hw4
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
